apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: { name: backups.ops.example.com }
spec:
  group: ops.example.com
  names: { kind: Backup, plural: backups, singular: backup }
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["schedule"]
              properties:
                schedule: { type: string, pattern: '^[-0-9*/, ]+$' }   # validate input
                retentionDays: { type: integer, minimum: 1, maximum: 365 }
      # CEL validation: reject retention > 90 for prod (example)
---
# RBAC must be scoped to this new type:
# rules: [{ apiGroups: ["ops.example.com"], resources: ["backups"], verbs: ["get","list","create"] }]
