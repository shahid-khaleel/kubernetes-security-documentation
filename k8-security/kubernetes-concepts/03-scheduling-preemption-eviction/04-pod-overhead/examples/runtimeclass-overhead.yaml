apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: { name: kata }
handler: kata
overhead:
  podFixed:
    cpu: "250m"
    memory: "160Mi"        # accounts for the Kata VM overhead in scheduling & quota
scheduling:
  nodeSelector: { runtime: kata }
---
# Pods opt in with:  spec.runtimeClassName: kata   (untrusted/multi-tenant workloads)
