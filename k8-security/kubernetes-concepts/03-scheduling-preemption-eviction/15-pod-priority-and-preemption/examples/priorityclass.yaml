apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: system-critical-security }
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Security/monitoring workloads (Falco, ingress). Restrict via admission policy."
---
# A tenant trying to set this should be BLOCKED by a Kyverno/Gatekeeper policy:
#   deny pods where priorityClassName is a system class unless in an allowed namespace.
