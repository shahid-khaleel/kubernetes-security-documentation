# /etc/sudoers.d/ops — least privilege. Validate ONLY with: visudo -cf <file>
Defaults    use_pty
Defaults    logfile="/var/log/sudo.log"
Defaults    requiretty
Defaults    lecture="always"
Defaults    passwd_timeout=1
# Allow ops to restart nginx only — NOT full root, NOT shell-escapable commands
%ops   ALL=(root) /usr/bin/systemctl restart nginx, /usr/bin/systemctl status nginx
# ❌ NEVER: %ops ALL=(ALL) NOPASSWD: ALL   (== root for everyone in ops)
# ❌ AVOID granting vi/less/find/env via sudo (GTFOBins shell escape)
