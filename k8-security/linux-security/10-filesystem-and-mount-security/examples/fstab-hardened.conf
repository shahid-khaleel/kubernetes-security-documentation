# /etc/fstab hardened mount options (CIS 1.1.x). Verify: mount | grep -E 'tmp|shm'
tmpfs   /tmp        tmpfs   defaults,rw,nosuid,nodev,noexec,relatime   0 0
tmpfs   /dev/shm    tmpfs   defaults,nosuid,nodev,noexec               0 0
/dev/sdb1 /var/log  ext4    defaults,nosuid,nodev,noexec               0 2
/dev/sdc1 /home     ext4    defaults,nosuid,nodev                      0 2
# noexec on /tmp,/dev/shm blocks the classic "drop payload in /tmp and run it" step.
