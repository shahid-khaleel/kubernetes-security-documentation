# base64 is ENCODING not encryption — pair Secrets with (a) RBAC, (b) encryption at rest
# (module 13), (c) an external store (module 14) for anything real.
apiVersion: v1
kind: Secret
metadata: { name: db-cred, namespace: payments }
type: Opaque
stringData:
  username: appuser
  password: "REPLACE_ME_use_ExternalSecrets_in_prod"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { namespace: payments, name: read-db-cred }
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["db-cred"]      # scope to THIS secret, not all secrets
    verbs: ["get"]
