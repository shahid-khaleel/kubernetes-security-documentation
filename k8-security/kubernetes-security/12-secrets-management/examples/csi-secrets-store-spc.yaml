# Mount secrets from an external store via the Secrets Store CSI driver (no etcd copy).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: vault-db, namespace: payments }
spec:
  provider: vault
  parameters:
    roleName: payments
    vaultAddress: https://vault.corp.example.com
    objects: |
      - objectName: "db-password"
        secretPath: "secret/data/payments/db"
        secretKey: "password"
