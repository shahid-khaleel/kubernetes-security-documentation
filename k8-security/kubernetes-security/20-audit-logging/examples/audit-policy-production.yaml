# Production audit policy — high signal, low noise (see labs/audit-policy.yaml too).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  - level: None
    users: ["system:kube-scheduler", "system:kube-controller-manager"]
  - level: None
    resources: [{ group: "", resources: ["events", "endpoints"] }]
  - level: Metadata
    resources: [{ group: "", resources: ["secrets", "configmaps"] }]  # never dump values
  - level: RequestResponse
    resources:
      - { group: "", resources: ["pods/exec", "pods/attach", "pods/portforward"] }
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - { group: "rbac.authorization.k8s.io" }
      - { group: "admissionregistration.k8s.io" }
  - level: Metadata
