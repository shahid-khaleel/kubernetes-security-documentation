# Per-tenant isolation kit: namespace + quota + limits + default-deny + PSA restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: tenant-a-quota, namespace: tenant-a }
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    count/services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata: { name: tenant-a-limits, namespace: tenant-a }
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: tenant-a }
spec: { podSelector: {}, policyTypes: ["Ingress","Egress"] }
