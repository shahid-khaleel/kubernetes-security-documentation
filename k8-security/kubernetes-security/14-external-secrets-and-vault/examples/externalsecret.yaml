# External Secrets Operator syncs a Vault path into a native k8s Secret, auto-rotated.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: { name: vault-backend, namespace: payments }
spec:
  provider:
    vault:
      server: https://vault.corp.example.com
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: payments
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: db-cred, namespace: payments }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: SecretStore }
  target: { name: db-cred, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: payments/db, property: password }
