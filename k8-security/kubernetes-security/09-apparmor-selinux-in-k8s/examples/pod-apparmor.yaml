# AppArmor via securityContext (k8s >=1.30). Profile must be loaded on the NODE first.
apiVersion: v1
kind: Pod
metadata: { name: apparmor-demo }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh","-c","sleep 1h"]
      securityContext:
        appArmorProfile:
          type: Localhost
          localhostProfile: k8s-deny-write   # loaded via apparmor_parser on each node
