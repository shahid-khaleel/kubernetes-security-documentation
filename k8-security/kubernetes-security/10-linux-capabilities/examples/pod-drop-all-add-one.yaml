# Drop ALL capabilities, add back only what's needed (bind <1024 -> NET_BIND_SERVICE).
apiVersion: v1
kind: Pod
metadata: { name: caps-minimal }
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      securityContext:
        capabilities:
          drop: ["ALL"]
          add: ["NET_BIND_SERVICE"]   # only this; NOT SYS_ADMIN/NET_RAW/etc.
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
